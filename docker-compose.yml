version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bidding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bidding_system
      POSTGRES_USER: bidding
      POSTGRES_PASSWORD: bidding123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidding -d bidding_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
